components:
  schemas:       
    BankAccountRequest:
      type: object
      properties:
        account_digit:
          type: string
          description: Account digit number
          example: "1"
        account_number:
          type: string
          description: Bank account number
          example: "1674"
        agency_digit:
          type: string
          description: Agency digit
          example: "8"
        agency_number:
          type: string
          description: Agency number 
          example: "2516"
        bank_code:
          type: string 
          description: Bank identification code. The code must be a valid code of a BACEN registered bank.
          minLength: 3
          maxLength: 3
          example: "144"
      required:
        - account_number
        - agency_number
        - bank_code
    BankAccountResponse:
      type: object
      properties:
        account_digit:
          type: string
          description: Account digit number
          example: "1"
        account_number:
          type: string
          description: Bank account number 
          example: "1674"
        agency_digit:
          type: string
          description: Agency digit
          example: "8"
        agency_number:
          type: string
          description: Agency number 
          example: "2516"
        bank_code:
          type: string
          description: Bank identifier code
          example: "144"        
        id:
          type: string
          description: Bank Account ID
          example: "f84afbb8-48de-4dd4-ba87-2c9aaa802837"
          pattern: UUID
          minLength: 36
          maxLength: 36
    BankAccountResponseList:
      type: array
      items:
        $ref: "#/components/schemas/BankAccountResponse"      