list_and_create_customer_bank_accounts:
  post:
    tags:
      - Bank Account
    summary: Register a Bank Account
    description: Create bank account information belonging to a **Customer**.
    operationId: create-customer-bank-account
    parameters:
      - name: customer-id
        in: path
        description: Customer ID
        required: true
        schema:
          type: string
    requestBody:
      description: Create a Bank Account
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/BankAccountRequest"
      required: true
    responses:
      201:
        description: Created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountResponse"
      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
      409:
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
      412:
        description: Precondition Failed
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
    x-codegen-request-body-name: data
  get:
    tags:
      - Bank Account
    summary: List all Bank Accounts of a Customer
    description: Get all bank accounts (and its informations) of a **Customer**.
    operationId: list-customer-bank-accounts
    parameters:
      - name: customer-id
        in: path
        description: Customer ID
        required: true
        schema:
          type: string
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountResponseList"
      400:
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
      404:
        description: Not Found
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
      412:
        description: Precondition Failed
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
      500:
        description: Internal Server Error
        content:
          application/json:
            schema:
              $ref: "../../error/ErrorResponse.yaml#/ErrorResponse"
