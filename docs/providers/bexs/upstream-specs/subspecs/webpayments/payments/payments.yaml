capture:
  post:
    tags:
      - Payments
    summary: Register payment
    description: |
      Receives and register a financial operation to be subsequently settled. The decision of when to send payments is entirely up to the partner. However, it is recommended to send the payment as soon as the sell checkout is done so Ebury Bank can guarantee the hedge of the operation. It is mandatory to use the Ebury Bank quotes service in order to obtain the exchange rate that will be used in payment registration.

      Considerations:

      - The exchange rate must be always updated, with the tolerance max of 5 minutes. It is an optional field and when not filled, the system will automatically obtain the current quotation based on the currency code informed. 

      - Only the **national_gross_amount** field is mandatory. Fill the other amount fields in case of:

        - **national_net_amount**: if you are charging your merchant for this operation. The net amount is the value that will be payed to the merchant. When not informed, the system will assume that gross and net are the same.

        - **foreign_gross_amount**: if you are fixing your price in foreign currency. In this case, you must inform also the corresponding exchange rate used, as national_gross_amount is mandatory. When not informed, the system will obtain the current quotation based on the currendy code informed and automatically find the foreign amount.

        - **foreign_net_amount**: same idea of national_net_amount and only used if you are charging your merchant and fixing your price in foreign currency.

    requestBody:
      content:
        'application/json':
          schema:
            oneOf:
              - $ref: '#/components/schemas/TypePayment'
              - $ref: '#/components/schemas/Expense'
    responses:
      '201':
        description: |
          Transaction received with success
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/CapturePaymentResponse'
      '400':
        $ref: './responses.yaml#/BadRequestFailure'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '409':
        $ref: './responses.yaml#/Conflict'
      '412':
        $ref: './responses.yaml#/PreconditionFailure'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
get:
  get:
    tags:
      - Payments
    parameters:
      - name: payment_id
        schema:
          type: string
        in: path
        description: |
          Payment identification
        required: false
      - name: legacy_id
        in: query
        schema:
          type: string
        description: |
          Query payment by legacy identification
      - description: The initial of pagination
        in: query
        name: offset
        schema:
          type: string
      - description: The final of pagination
        in: query
        name: limit
        schema:
          type: string
    summary: |
      Query payment
    description: |
      Query a payment information
    responses:
      '200':
        description: |
          Payment information
        content:
          'application/json':
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PaymentResponse'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '404':
        $ref: './responses.yaml#/NotFound'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
cancel:
  post:
    tags:
      - Cancellations
    summary: Payment Cancel
    description: |
      Receives a partial or full cancellation request. 

      Considerations:

        - In case of the payment operation had already been settled, the cancellation request *must be analysed by Ebury Bank team in order to proceed with the refund*.

        - The cancellation rate is always updated with the current exchange rate. It is automatically filled by the system.

        - Whenever the cancellation amount is not informed, zero (0) or equals to the payment amount, it will be considered a full cancellation.

        - It is possible to inform only national_amount or foreign_amount. The system will calculate automatically and compare with the payment value. 

        - The cancellation will be rejected if the amount requested is superior to the payment amount registered.

    parameters:
      - name: payment_id
        in: path
        description: |
          Payment identification
        required: true
        schema:
          type: string
    requestBody:
      content:
        'application/json':
          schema:
            $ref: '#/components/schemas/Cancel'
    responses:
      '201':
        description: |
          Transaction received with success
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/CancelResponse'
      '400':
        $ref: './responses.yaml#/BadRequestFailure'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '409':
        $ref: './responses.yaml#/Conflict'
      '412':
        $ref: './responses.yaml#/PreconditionFailure'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
