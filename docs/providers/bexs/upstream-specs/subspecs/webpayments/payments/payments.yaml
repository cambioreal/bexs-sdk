          default: INDIVIDUAL
          enum:
            - INDIVIDUAL
            - COMPANY
        document_number:
          description: |
            The consumer registration number. In Brazil, this number is the CPF (11 digits) for individuals, or CNPJ (14 digits) for business company.
          type: string
          maxLength: 20
          example: 12345678909
        date_of_birth:
          description: |
            Customer's birth date. Mandatory when type is INDIVIDUAL.
          type: string
          format: date
        first_name:
          description: |
            Customer's first name. Mandatory when type is INDIVIDUAL.
          type: string
          maxLength: 512
        last_name:
          description: |
            Customer's last name. Mandatory when type is INDIVIDUAL.
          type: string
          maxLength: 512
        legal_name:
          description: |
            Customer's legal name. Mandatory when type is COMPANY
          type: string
          maxLength: 512
        full_name:
          description: |
            Customer's full name.
          type: string
          maxLength: 512
        address:
          $ref: '#/components/schemas/Address'
        email:
          description: |
            Customer's e-mail.
          type: string
          format: email
          maxLength: 256
        phone:
          $ref: '#/components/schemas/Phone'
        document_validation_date:
          description: |
            Date of the last document validation run before Brazil's IRS.
          type: string
          format: date
    Phone:
      description: |
        Customer's phone number.
      type: object
      required:
        - number
      properties:
        number:
          description: |
            Phone's number, inform numbers only.
          type: string
          maxLength: 20
          minLength: 8
        area_code:
          description: |
            Phone's area code.
          type: string
          maxLength: 3
          minLength: 1
        country_code:
          description: |
            Phone's country code.
          type: string
          maxLength: 10
          minLength: 1
        provider:
          description: |
            Phone's provider.
          type: string
          maxLength: 32
    Address:
      required:
        - street
        - number
        - neighborhood
        - city_name
        - state_code
        - zip_code
        - country_code
      description: |
        Customer's address.
      type: object
      properties:
        street:
          description: |
            Street's name.
          maxLength: 255
          type: string
        number:
          description: |
            Address's number.
          maxLength: 10
          type: string
        complement:
          description: |
            Address's complement.
          type: string
          maxLength: 50
        neighborhood:
          description: |
            Neighborhood's name.
          maxLength: 255
          type: string
        city_name:
          description: |
            City's name.
          minLength: 1
          maxLength: 255
          type: string
        state_code:
          description: |
            State's initials (ISO 3166-2 alpha-2).
          maxLength: 2
          minLength: 2
          type: string
        country_code:
          description: |
            Country ISO code (ISO 3166-1 alfa-3).
          maxLength: 3
          minLength: 1
          type: string
        zip_code:
          description: |
            Postal code, without special characters.
          type: string
          maxLength: 9
          minLength: 8
          pattern: '^\d{8-9}$'
    Id:
      description: |
        Operation's identification. This hash is unique per partner, and follows the UUID v4 specification
      type: string
      maxLength: 128
      minLength: 1
    LegacyId:
      description: |
        Operation's identification. This hash is unique per partner, and follows the UUID v4 specification
      type: string
      maxLength: 128
      minLength: 1
    ExternalId:
      description: |
        This identification is informed by Partner to control and avoid payment's duplicity
      type: string
      maxLength: 128
      minLength: 1
    CurrencyCode:
      description: |
        Foreign currency code involved on the operation as specified in [ISO 4217].
        It must be a currency in which the partner is authorized to operate with us.
      type: string
      default: USD
      maxLength: 3
      minLength: 3
