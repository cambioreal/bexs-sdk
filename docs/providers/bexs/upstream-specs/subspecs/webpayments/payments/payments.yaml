        email:
          description: |
            Customer's e-mail.
          type: string
          format: email
          maxLength: 256
        phone:
          $ref: '#/components/schemas/Phone'
        document_validation_date:
          description: |
            Date of the last document validation run before Brazil's IRS.
          type: string
          format: date
    ConsumerIndividual:
      title: Individual
      description: |
        Financial operation's customer.
      type: object
      required:
        - document_number
        - type
        - date_of_birth
        - first_name
        - last_name
        - legal_name
      properties:
        type:
          description: |
            Type of consumer in Brazil, being “INDIVIDUAL“ for natural person, or “COMPANY“ if your consumer is a legal person.
