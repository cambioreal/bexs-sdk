getLimit:
  get:
    tags:
      - Payments
    consumes:
      - application/json
    description: |
      Fetch a Limit by Document Number

      The Brazilian Central Bank regulation stablishes that each payment can not be over than 10,000 dollars or equivalent in another currency. Also the sum of all payments for the same consumer cannot exceed *120,000 dollars in the year*. Use this functionallity to check the limit used.
    parameters:
      - description: The Document Number
        in: path
        name: document_number
        required: true
        type: string
    produces:
      - application/json
    responses:
      '200':
        description: OK
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/entity.Limit'
      '400':
        $ref: './responses.yaml#/BadRequestFailure'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '409':
        $ref: './responses.yaml#/Conflict'
      '412':
        $ref: './responses.yaml#/PreconditionFailure'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
components:
  schemas:
    Event:
      type: object
      readOnly: true
      properties:
        header:
          type: object
          properties:
            type:
              description: |
                Event type
              type: string
              enum:
                - PAYMENT_CAPTURED
                - PAYMENT_INVALIDATED
                - PAYMENT_ACCEPTED
                - PAYMENT_REJECTED
                - PAYMENT_DUPLICATED
                - OPERATION_MOVED
                - SELECTED_FOR_SETTLEMENT
                - SELECTED_FOR_REGISTRY
                - CANCELLATION_INVALIDATED
                - CANCELLATION_ACCEPTED
            time:
              description: |
                System generated event's timestamp
              type: date-time
            id:
              description: |
                Event identification
              type: string
        payment:
          $ref: '#/components/schemas/Payment'
        cancellation:
          $ref: '#/components/schemas/Cancel'
    Cancel:
      type: object
      properties:
        type:
          description: |
            Informs the cancellation type. This info is generated by the system according to the operation's current status
          type: string
          readOnly: true
          enum:
            - REVERSION
            - REFUND
            - UNREGISTER
        external_id:
          description: |
            This identification is informed by Partner to control and avoid cancellation's duplicity
          type: string
          maxLength: 128
          minLength: 1
        foreign_amount:
          description: |
            Cancellation gross amount in foreign currency, use two decimal places.
          type: number
          format: float
          maximum: 999999999999.99
          minimum: 0.01
        national_amount:
          description: |
            Cancellation gross amount in national currency, use two decimal places.
          type: number
          format: float
          maximum: 999999999999.99
          minimum: 0.01
        partial:
          description: |
            System informs when the cancellation is partial
          type: boolean
          readOnly: true
    CancelResponse:
      type: object
      properties:
        cancellationId:
          description: |
            The cancellation_id is a ID generated based a fingerPrint. If the partner inform by 
            request the 'external_id', the fingerPrint use this attribute to generate the cancellation_id.
            If 'external_id' not informed, the API use following attributes from request as fingerPrint to generate the cancellation_id:
            - partner_id
            - payment_id
            - date as current date
          type: string
    PaymentResponse:
      type: object
      properties:
        external_id:
          type: string
          description: |
            This identification is informed by Partner to control and avoid payment's duplicity
          maxLength: 128
          minLength: 1
        type:
          $ref: '../commons/components.yaml#/components/schemas/PaymentType'
          readOnly: false
        date:
          description: |
            Operation date, between customer and seller
          type: string
          format: date-time
        foreign_gross_amount:
          description: |
            Operation's gross amount in foreign currency, use two decimal places.
            The informed value must oblige the following formula:
            foreignAmount = nationalAmount / exchangeRate
          type: number
          format: float
          maximum: 999999999999.99
          minimum: 0.01
          example: 45.50
        national_gross_amount:
          description: |
            Operation's gross amount in national currency, use two decimal places.
            The informed value must oblige the following formula:
            nationalAmount = foreignAmount * exchangeRate
          type: number
          format: float
          maximum: 999999999999.99
          minimum: 0.01
          example: 18.20
        foreign_net_amount:
          description: |
            Operation's net amount in foreign currency, use two decimal places.
            The informed value must oblige the following formula:
            foreignNetAmount = nationalNetAmount / exchangeRate
          type: number
          format: float
          maximum: 999999999999.99
          minimum: 0.01
          example: 41.50
        national_net_amount:
          description: |
            Operation's net amount in national currency, use two decimal places.
            The informed value must oblige the following formula:
            nationalNetAmount = foreignNetAmount * exchangeRate
          type: number
          format: float
          maximum: 999999999999.99
          minimum: 0.01
          example: 16.60
        exchange_rate:
          description: |
            Operation exchange rate, use four decimal places.
          type: number
          format: float
          example: 2.5000
        currency_code:
          $ref: '../commons/components.yaml#/components/schemas/CurrencyCode'
          readOnly: false
        payment_method:
          description: |
            Customer's chosen payment method for the operation.
            - CREDIT_CARD, Credit card;
            - DEBIT_CARD, Debit card;
            - ELECTRONIC_FUNDS_TRANSFER, Electronic transfer;
            - BANK_BILLET, Bank Billet - Cannot be used when productCategory = SERVICES;
            - VOUCHER, Voucher;
            - WALLET, Credit through online wallet;
            - PIX, Instant electronic transfer;
            - CREDIT_ACCOUNT, Can be used only for configured partners - Category must be SERVICES.
          type: string
          enum:
            - CREDIT_CARD
            - DEBIT_CARD
            - ELECTRONIC_FUNDS_TRANSFER
            - BANK_BILLET
            - VOUCHER
            - WALLET
            - PIX
            - CREDIT_ACCOUNT
        product_category:
          $ref: '../commons/components.yaml#/components/schemas/ProductCategory'
          readOnly: false
        expense_type:
          $ref: '../commons/components.yaml#/components/schemas/ExpenseType'
          readOnly: false
        merchant_used_psp:
          description: |
            Informs when the merchant processed the transaction through a PSP (payment solution provider), Gateway, or other type of intermediary.
            When true, the intermediary information becomes mandatory.
          type: boolean
          default: false
        merchant_id:
          type: string
          description: |
            Merchant's identification returned by our merchant API.
        psp_id:
          type: string
          description: |
            Intermediary identification returned by our merchant API, mandatory when merchant_used_psp param is "true".
        consumer:
          $ref: '#/components/schemas/Consumer'
        status:
          $ref: '../commons/components.yaml#/components/schemas/PaymentStatus'
          readOnly: true
    Payment:
      title: Payment
      type: object
      required:
        - type
        - date
        - national_gross_amount
        - foreign_amount
        - currency_code
        - payment_method
        - consumer
        - merchant_id
      properties:
