move:
  post:
    tags:
      - Buckets
    summary: |
      Move operations to a bucket
    description: |
      The bucket is created in the moment of the move. As soon as the transactions are in the below mentioned status, it is possible to move it to a bucket.<br />
       - Payments: If the stage is “REGISTRY” and the status “COMPLETED”, use the payment_id to move it to a bucket;<br />
       - Refund: If the status is “AVAILABLE_SETTLEMENT”, use the cancellation_id  to move it to a bucket.

       *Moves request of transactions in any other status will the rejected.<br />

       **Please note:**
       - Moves of payment IDs and cancellation IDs must be done separeted;
       - The bucket can be created using any criteria, mixing different merchants and payments, except for different currencies (it is not possible to have transactions with different currencies in the same bucket: the first one will be moved in and the others will be rejected);
       - Only REFUND cancellations must be moved to a bucket (it is not necessary to move REVERSAL and UNREGISTER cancellations);
       - It is possible to move up to 1000 transactions at a time;
       - In order to settle different operations (payments, expenses and refunds) by the net amount, move all of them to the same bucket.
       <div style="text-indent: 10px;"><b>Attention: </b>In the moment of the checkout, payments transactions total amount must always be greater than expenses and refund transactions total amounts.</div>
    parameters:
      - name: bucket_name
        in: path
        description: |
          Inform a name to the bucket to be created in the move of the selected transactions.  Use any alphanumeric pattern without special characters (such as ‘@', '#', '$', '%’ etc).<br />
          **Attention:** It will be used in the next steps of the settlement proccess.
        required: true
        schema:
          type: string
          maximum: 100
    requestBody:
      content:
        'application/json':
          schema:
            oneOf:
              - $ref: '#/components/schemas/BucketsMovePayment'
              - $ref: '#/components/schemas/BucketsMoveCancellation'
    responses:
      '201':
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/AnswerMove'
      '400':
        $ref: './responses.yaml#/BadRequestFailure'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '409':
        $ref: './responses.yaml#/Conflict'
      '412':
        $ref: './responses.yaml#/PreconditionFailure'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
get:
  get:
    tags:
      - Buckets
    summary: |
      Query a bucket
    description: |
      Use the bucket name to fetch its information.<br />
      It is also possible to use the parameters mentioned below to filter especific information (you can fill one or more fields separated with comma).
    parameters:
      - description: The bucket name
        in: path
        name: bucket_name
        required: true
        schema:
          type: string
      - schema:
          $ref: '../commons/components.yaml#/components/schemas/OperationType'
        in: query
        name: operation_type
      - schema:
          $ref: '../commons/components.yaml#/components/schemas/PaymentType'
        in: query
        name: payment_type
        required: false
      - schema:
          $ref: '../commons/components.yaml#/components/schemas/ProductCategory'
        in: query
        required: false
        name: product_category
      - schema:
          $ref: '../commons/components.yaml#/components/schemas/Stage'
        in: query
        name: stage
      - schema:
          $ref: '../commons/components.yaml#/components/schemas/BucketStatus'
        in: query
        name: status
      - description: The initial of pagination
        in: query
        name: offset
        schema:
          type: integer
      - description: The final of pagination
        in: query
        name: limit
        schema:
          type: integer
    responses:
      '200':
        description: |
          Bucket's information.
        content:
          'application/json':
            schema:
              items:
                $ref: '#/components/schemas/entity.Bucket'
              type: array
      '400':
        $ref: './responses.yaml#/BadRequestFailure'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '409':
        $ref: './responses.yaml#/Conflict'
      '412':
        $ref: './responses.yaml#/PreconditionFailure'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
bucket-balance:
  get:
    tags:
      - Buckets
    consumes:
      - application/json
    summary: Bucket balance
    description: |
      Use the bucket name to fetch its balance, separated by merchant.<br /><br />
      **Important:**
        - The amount displayed may not be the final one registered in the FX operation, due to rounding and applied taxes;
        - Once the bucket checkout is requested, it is not possible to fetch its balance anymore.
    parameters:
      - description: The bucket name
        in: path
        name: bucket_name
        required: true
        schema:
          type: string
    produces:
      - application/json
    responses:
      '200':
        description: OK
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/entity.BucketBalance'
      '400':
        $ref: './responses.yaml#/BadRequestFailure'
      '401':
        $ref: './responses.yaml#/Unauthorized'
      '409':
        $ref: './responses.yaml#/Conflict'
      '412':
        $ref: './responses.yaml#/PreconditionFailure'
      '500':
        $ref: './responses.yaml#/ServerFailure'
      '503':
        $ref: './responses.yaml#/ServiceUnavailable'
