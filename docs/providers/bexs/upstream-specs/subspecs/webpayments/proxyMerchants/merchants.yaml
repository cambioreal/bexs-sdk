create_foreign_accounts:
  post:
    consumes:
      - application/json
    description: Create a foreign account registration.
    parameters:
      - description: Merchant identification
        in: path
        name: merchant_id
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      content:
        'application/json':
          schema:
            $ref: '#/definitions/domain.ForeignAccount'
    produces:
      - application/json
    responses:
      '201':
        description: OK
        content:
          'application/json':
            schema:
              $ref: '#/definitions/domain.ForeignAccountResponse'
      '400':
        description: Bad Request
        content:
          'application/json':
            schema:
              $ref: '#/definitions/domain.Error'
      '404':
        description: Not Found
        content:
