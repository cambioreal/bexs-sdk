openapi: 3.0.0
info:
  title: Account API's
  version: '1'

components:
  schemas:
    paymentMethods:
      description: >
        By which method the payment will be made. Available options
        are: __ELECTRONIC_TRANSFER__ for TED, or __PIX__ for Instant Payments.</br>
        If not filled in, the default value will be __ELECTRONIC_TRANSFER__.
      type: string
      enum:
        - ELECTRONIC_TRANSFER
        - PIX
    withdrawStatus:
      type: string
      enum:
        - PROCESSING
        - COMPLETED
        - REVERTED
      description: >
        The status field refers to the status of a transaction.
        If a transaction is "PROCESSING", it is still yet to be "COMPLETED" or "REVERTED".
        This field exists to differentiate the events as the response shows us all the records of a selected date.
        Transaction IDs can be presented as duplicated if the "COMPLETED" or "REVERTED" events happened
        on the same date searched that includes the "PROCESSING" event.
        In this case, the status will differ from event to event.
        For the final balance, it only considers the "COMPLETED" or "REVERTED".
    sandboxDepositRequest:
      properties:
        amount:
          description: must be greater than 0 with most 2 decimal places
          type: number
          format: double
          pattern: \d+\.\d{2}
        payment_method:
          $ref: '#/components/schemas/paymentMethods'
        qrcode_external_id:
          description: >-
            The external identifier used to generate qr-code. It will be used to change the qr-code status
            to PAID. If "payment_method" is not "PIX", the "qrcode_external_id" field will be discarded
          type: string
        source:
          type: object
          properties:
            document:
              description: >-
                Document of payer that you want to simulate the deposit. For PIX deposit simulation with
                qr-code, the payer document must be the same has been sent when the qr-code was generated
              type: string
            bank_ispb:
              description: >-
                This is the bank ISPB wich you want to simulate the money is coming from. Must be used an ISPB valid
                for Bacen (Brazilian Central Bank)
              type: string
            number:
              description: >-
                Account number with you want to simulate the money is coming from. May be used a random numeric
                number.
              type: string
              format: number
              maximum: 9
            agency_number:
              description: >-
                Agency number with you want to simulate the money is coming from
              type: string
          required:
            - document
            - bank_ispb
            - number
            - agency_number
      required:
        - amount
        - payment_method
        - source
    withdrawRequest:
      properties:
        correlation_id:
          description: An identifier provided by the API caller to reference the transaction in future calls.
          type: string
        amount:
          description: Must be greater than 0 with most 2 decimal places.
          type: number
          format: double
          pattern: \d+\.\d{2}
        payment_method:
          $ref: '#/components/schemas/paymentMethods'
        target:
          type: object
          properties:
            customer_id:
              description: Identifier of profile account generated when profile was registered.
              type: string
            bank_account_id:
              description: Identifier of external bank account provided when profile was registered.
              type: string
            pix_key:
              description: >-
                Alias for a registered external bank account, used for instant payment (PIX).</br>
                Must be a valid CPF/CNPJ, email, smartphone number or
                32-character-UUID (also known as EVP - which stands for "Virtual Payment Address").</br>
                It's optional if `bank_account_id` is being used, otherwise it must be present within the request.
              type: string
            bank_account:
              description: Bank account number and digit.
              type: string
            bank_account_type:
              description: >
                Type of bank account. This field is optional for PIX transactions using `pix_key`.</br>
                The possible values are:
                "CURRENT_ACCOUNT": A current account (also known as checking account) is a type of bank account that allows deposits and withdrawals, typically used for daily transactions.
                "SALARY_ACCOUNT": A salary account is a type of bank account that is specifically designed for receiving salary payments.
                "SAVINGS_ACCOUNT": A savings account is a type of bank account that is primarily used for saving money and earning interest.
              type: string
              enum: [CURRENT_ACCOUNT, SALARY_ACCOUNT, SAVINGS_ACCOUNT]
            bank_agency:
              description: Bank agency number.
              type: string
            document_number:
              description: Customer document number/ID number (CPF/CNPJ).
              type: string
            full_name:
              description: Customer full name.
              type: string
            bank_ispb:
              description: Brazilian Payment System Identifier of the target bank.
              type: string
          required:
            - customer_id
            - bank_account_type
        source:
          type: object
          description: Used to inform the source of the withdrawal transaction. If informed document_number or profile_id are required. This is valid only for partners with de-centralized balance
          properties:
            document_number:
              description: Sender document number/ID number (CPF/CNPJ).
              type: string
            profile_id:
              description: Identifier of profile account generated when profile was registered.
              type: string
        pix_message:
            type: string
            example: "Payment for order #12345"
            description: "Optional message that will be included in the PIX transfer"
      required:
        - correlation_id
        - amount
        - target
    withdrawResponse:
      properties:
        id:
          description: Withdraw ID
          type: string
          pattern: uuid
        payment_method:
          $ref: '#/components/schemas/paymentMethods'
        status:
          $ref: '#/components/schemas/withdrawStatus'
        created_at:
          type: string
          pattern: RFC-3339Nano
        reversal_code:
          type: integer
        reversal_reason:
          type: string
    withdrawCreated:
      properties:
        id:
          description: Withdrawal ID
          type: string
          pattern: uuid
        correlation_id:
          description: Correlation ID
          type: string
          pattern: uuid
        payment_method:
          $ref: '#/components/schemas/paymentMethods'
        status:
          $ref: '#/components/schemas/withdrawStatus'
        created_at:
          type: string
          pattern: RFC-3339Nano
        reversal_code:
          type: integer
        reversal_reason:
          type: string
    account:
      properties:
        customer_id:
          type: string
        document_number:
          type: string
        full_name:
          type: string
        agency_number:
          type: string
        agency_digit:
          type: string
        number:
          type: string
    movement:
      description: ''
      properties:
        id:
          type: string
        timestamp:
          type: string
          example: '2021-06-04T19:42:26Z'
          pattern: RFC-3339Nano
        debit:
          type: number
          format: double
          description: Always will be a positive value and if present will represent an outbound amount.
        credit:
          type: number
          format: double
          description: Always will be a positive value and if present will represent an inbound amount.
    transaction:
      properties:
        id:
          type: string
          description: internal transaction id
        correlation_id:
          type: string
          description: client defined id
        gateway_correlation_id:
          type: string
          description: id defined by our gateway/partner/network
        type:
          type: string
        metadata:
          type: object
        counterparty_id:
          type: string
        source:
          $ref: '#/components/schemas/account'
          description: which account has originated the transaction
        target:
          description: which account has received the transaction
          $ref: '#/components/schemas/account'
    records:
      properties:
        movement:
          $ref: '#/components/schemas/movement'
        transaction:
          $ref: '#/components/schemas/transaction'
    statementResponse:
      properties:
        account:
          $ref: '#/components/schemas/account'
        previous_balance:
          description: previous day consolidated balance
          type: number
          format: double
        date:
          description: from which date the statement start
          type: string
          format: date
          pattern: YYYY-dd-mm
        actual_balance:
          description: intermediary balance considering the records for the selected period
          type: number
          format: double
        records:
          description: list of transactions
          type: array
          items:
            $ref: '#/components/schemas/records'
    withdrawStatusChangedCallbackBody:
      properties:
        withdraw_id:
          type: string
        document_number:
          type: string
        updated_at:
          type: string
          pattern: RFC-3339Nano
        reversal_code:
          type: string
        reversal_reason:
          type: string
          description: >
            <details>
              <summary>Possible values for reversal_code and reversal_reason fields:</summary>
              <table>
                <tr>
                  <td>reversal_code</td>
                  <td>reversal_reason</td>
                </tr>
                <tr>
                  <td>1</td>
