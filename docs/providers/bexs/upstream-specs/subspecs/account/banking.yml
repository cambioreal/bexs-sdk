        deposit_id: c6a539f9-29bc-409d-8934-b4372af75391
        document_number: 65375896825
        amount: 6.36
        updated_at: '2021-06-04T19:42:26Z'
        source:
          agency_number: 1368
          account_number: 5343168
          bank_ispb: 13059145
          bank_compe: 144
          customer_id: 925dc1c5-0fd7-4c5d-a27c-f8683089b774
        type: DEPOSIT
        payment_method: PIX
        currency_code: BRL

paths:
  /v1/banking/accounts/{partner-id}/withdraws:
    post:
      operationId: create-withdrawal
      tags:
        - Withdraw
      summary: Perform a Withdrawal
      description: |
        Creates a withdrawal transaction.

        The Electronic Transfer (TED) payment method is only valid on weekdays, except public holidays, from 06:35 to 16:30 (Brazilian Time / UTC-3).
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          description: Key to identify a unique withdrawal transaction. Optional.
          schema:
            type: string
        - name: partner-id
          in: path
          required: true
          description: The partner identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/withdrawRequest'
            examples:
              ted:
                summary: Electronic Transfer (TED)
                value: {                          
                          "correlation_id": "1f6d52eb445095b962af2734080c00c4",
                          "payment_method":"ELECTRONIC_TRANSFER",
                          "amount":8.92,
                          "target": {
                            "customer_id":"customer-id",
                            "bank_account_id":"external-account-id"
                          },
                          "source": {
                            "document_number":"12345678901"
                          }
                        }
              pix_customerId_bankAccountId:
                summary: Pix Using customerId and bank_account_id
                value: {
                          "correlation_id": "1f6d52eb445095b962af2734080c00c4",
                          "payment_method":"PIX",
                          "amount":8.92,
                          "target": {
                            "customer_id":"customer-id",
                            "bank_account_id":"external-account-id",
                            "bank_account_type": "SAVINGS_ACCOUNT"
                          },
                          "source": {
                            "profile_id": "uio34hfo-3487yf0-38794"                        
                          }
                        }
              pix_key:
                summary: Instant Payment (PIX) using Key
                value: {
                          "correlation_id": "1f6d52eb445095b962af2734080c00c4",
                          "payment_method":"PIX",
                          "amount":10.90,
                          "target": {
                            "customer_id":"customer-id",
                            "pix_key":"pix-key"
                          }
                        }
              pix:
                summary: Instant Payment (PIX) without a pre-registered key
                value: {
                          "correlation_id": "1f6d52eb445095b962af2734080c00c4",
                          "payment_method":"PIX",
                          "amount":5.71,
                          "target": {
                            "customer_id":"customer-id",
                            "bank_account": "customer-account-number-and-digit",
                            "bank_agency": "customer-account-agency",
                            "document_number": "customer-document-number",
                            "full_name": "customer-full-name",
                            "bank_ispb": "customer-bank-account-ispb"
                          }
                        }
      responses:
        '400':
          description: Errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                    example: "target.account.bank_agency must not be longer than 4"
                  code:
                    type: string
                    description: Error code
                    example: 'invalidPayload'
        '404':
          description: Errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                    example: "Pix key was not found"
                  code:
                    type: string
                    description: Error code
                    example: 'pixKeyNotFound'
        '201':
          description: Transaction created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/withdrawCreated'
    get:
      operationId: search-withdrawal
      tags:
        - Withdraw
      summary: Search a Withdrawal
      description: Searches a transaction using `correlation-id` and `withdraw-date`.
      parameters:
        - name: partner-id
          in: path
          required: true
          description: The partner identifier.
          schema:
            type: string
        - name: correlation-id
          in: query
          required: true
          description: Identifier provided by the API caller used to reference the created transaction.
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            pattern: YYYY-mm-dd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/withdrawResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
              examples:
                notFound:
                  value:
                    message: transaction not found
        '5XX':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                properties:
                  message:
                    type: string
              examples:
                internalError:
                  value:
                    message: Internal Server Error
  /v1/banking/accounts/{partner-id}/withdraws/validate:
    get:
      operationId: validate-withdrawal
      tags:
        - Withdraw
      summary: Validate a Withdrawal
      description: Checks if a given withdrawal transaction is valid before actually performing the operation.
      parameters:
        - name: partner-id
          required: true
          description: The partner identifier.
          in: path
          schema:
            type: string
        - name: source
          description: |
            The document number of the account owner from which the withdrawal transaction will originate.

            One of the source parameters (`source`, `source-id`) must be informed, but only one of them.
          in: query
          schema:
            type: string
        - name: source-id
          description: |
            The identifier of the account owner from which the withdrawal transaction will originate.

            One of the source parameters (`source`, `source-id`) must be informed, but only one of them.
          in: query
          schema:
            type: string
        - name: target
          description: |
            The document number of the account owner where the withdrawal transaction will go.

            One of the target parameters (`target`, `target-id`) must be informed, but only one of them.
          in: query
          schema:
            type: string
        - name: target-id
          description: |
            The identifier of the account owner where the withdrawal transaction will go.

            One of the target parameters (`target`, `target-id`) must be informed, but only one of them.
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The given withdrawal transaction is valid.
        '412':
          description: The given withdrawal transaction is invalid.
  /v1/banking/accounts/{partner-id}/withdraws/{withdraw-id}:
    get:
      operationId: get-withdrawal
      tags:
        - Withdraw
      summary: Get a Withdrawal
      description: Gets a single withdrawal transaction from using the provided id.
      parameters:
        - name: partner-id
          in: path
          required: true
          description: The partner identifier.
          schema:
            type: string
        - name: withdraw-id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            pattern: YYYY-mm-dd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/withdrawResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
              examples:
                notFound:
                  value:
                    message: transaction not found
  /v1/banking/accounts/{partner-id}/statements:
    get:
      operationId: get-statement
      parameters:
        - name: report-type
          in: query
          description: >-
            Which transactions should be retrieved: In[credits], Out[debits] or All[credits and debits]
          required: true
          schema:
            type: string
            default: All
            enum:
              - All
              - In
              - Out
        - name: period-start
          description: |
            Start date to the search. \
            Example: period-start = 2022-09-20, the search brings all the values from 00:00:00 of the day 2022-09-20.\
            Time Zone considered for the search: 'America/Sao_Paulo' -> UTC-3
          required: true
          in: query
          schema:
            type: string
            format: date
            pattern: YYYY-mm-dd
        - name: period-end
          description: |
            End date to the search, this will not include the selected date in the search. \
            Example: period-end = 2022-09-21, the search brings all the values until 23:59:59 of the day 2022-09-20.\
            Time Zone considered for the search: 'America/Sao_Paulo' -> UTC-3
          required: true
          in: query
          schema:
            type: string
            format: date
            pattern: YYYY-mm-dd
        - name: document
          description: Filter transactions that where sent by this document number only.
          required: false
          in: query
          schema:
            type: string
            pattern: \\d{11}|\\d{14}
        - name: limit
          description: How many transactions must be retrieved per call. If limit is not sent or = 0, then all transactions will be retrieved.
          required: false
          in: query
          schema:
            default: 0
            type: integer
        - name: start-after
          description: |
            At which point should start the search. This refers to the offset (offset = previous offset + limit).
            If parameter 'limit' is used and higher than 0, start-after needs do be filled.
          required: false
          in: query
          schema:
            type: integer
        - name: format
          in: query
          description: Which type of report should be generated
          required: true
          schema:
            type: string
            default: json
            enum:
              - json
        - name: partner-id
          required: true
          description: the account that will originate the withdraw transaction
          in: path
          schema:
            type: string
      tags:
        - Statement
      summary: Get a Statement
      description: |
        Allow partner to obtain it's statement
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/statementResponse'
        '404':
          description: Not Found
        '401':
          description: Unauthorized
  /v1/banking/accounts/{partner-id}/sandbox/deposits:
    post:
      operationId: create-deposit
      tags:
        - Deposit
      summary: Simulate a deposit
      description: |
        Simulate a deposit in a specific {partner-id}. This endpoint allows deposit money into the banking account
        for payment tests.

        When "payment_method" is "PIX" and a "qrcode_external_id" has been informed, the qr-code associated with
        that id will be changed to PAID status.

        <p>THIS ENDPOINT IS NOT AVAILABLE IN PRODUCTION ENVIRONMENT.<p>
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: false
          description: >
            Key to identify unique deposit transaction. Optional.
          schema:
            type: string
        - name: partner-id
          required: true
          description: the account that will receive the money
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sandboxDepositRequest'
            examples:
              ted:
                summary: Electronic Transfer (TED)
                value: {
                  "amount":8.92,
                  "payment_method":"ELECTRONIC_TRANSFER",
                  "source": {
                    "document":"12345678901",
                    "bank_ispb":"00000000",
                    "number":"123456789",
                    "agency_number":"1234"
                  }
                }
              pix:
                summary: Deposit Instant Payment (PIX)
                value: {
                  "amount":8.92,
                  "payment_method":"PIX",
                  "source": {
                    "document":"12345678901",
                    "bank_ispb":"00000000",
                    "number":"123456789",
                    "agency_number":"1234"
                  }
                }
              pix_qrcode:
                summary: Deposit Instant Payment (PIX) with QR Code
                value: {
                  "amount":8.92,
                  "payment_method":"PIX",
                  "qrcode_external_id": "abcdef",
                  "source": {
                    "document":"12345678901",
                    "bank_ispb":"00000000",
                    "number":"123456789",
                    "agency_number":"1234"
                  }
                }
      responses:
        4XX:
          description: errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
        '404':
          description: not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        201:
          description: transaction created successfully

# Due to the fact that the x-webhooks tag is unique and can only be used once in the project structure
# all webhook declarations have been centered in the file: /specs/webhooks.yml
x-webhooks:
  deposit:
    post:
      tags:
        - Notification
      summary: Deposit Notification
      description: |
        When we receive a event of this transaction, e.g: complete or reverse, after process internally we'll relay this to your server.
      parameters:
        - in: header
          name: X-Signature-#
          description: >
            Represents the body of this sent request considering only one line break at the end of the structure. Then its signed using HMAC + SHA256 algorithm by the server with agreed key.
            The symbol '#' represents the index of the registered active key starting from 0.
            This header only appears for the partners with "SIGNATURE" authentication type.
          schema:
            type: string
          example: +TCZkPtuwIPcdmYg9lCLMtsTxvXHiNnu3Us4GsTLwvI=
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/depositCallback'
            example:
              $ref: '#/components/examples/depositCallbackExample'
      responses:
        '200':
          description: Your server implementation should return this HTTP status code if the data was received successfully
          content:
            text/plain:
              schema:
        '4XX':
          description: If your server implementation return this we will try to deliver the callback again
          content:
            text/plain:
              schema:
        '5XX':
          description: If your server implementation return this we will try to deliver the callback again
          content:
            text/plain:
              schema:
  withdrawal:
    post:
      tags:
        - Notification
      summary: Withdrawal Notification
      description: "When we receive a event of this transaction, e.g: complete or reverse, after process internally we'll relay this to your server."
      parameters:
        - in: header
          name: X-Signature-#
          description: >
            Represents the body of this sent request considering only one line break at the end of the structure. Then its signed by the server using agreed key.
            The symbol '#' represents the index of the registered active key starting from 0.
            This header only appears for the partners with "SIGNATURE" authentication type.
          schema:
            type: string
          examples:
            signature-example:
              value: j9uEQPpeWIgdooN3UZ8Iu2JiuQqR2vRuKO2cGo5cDPI=
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/withdrawStatusChangedCallbackBody'
            example:
              headers:
                X-Signature-1: j9uEQPpeWIgdooN3UZ8Iu2JiuQqR2vRuKO2cGo5cDPI=
