                  <td>Register with Inconsistency - Barcode documents</td>
                </tr>
                <tr>
                  <td>13</td>
                  <td>Duplicate Register - Barcode documents</td>
                </tr>
                <tr>
                  <td>14</td>
                  <td>Unidentified beneficiary - Barcode documents</td>
                </tr>
